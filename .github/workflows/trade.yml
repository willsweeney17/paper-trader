name: trade
on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"   # every 5 min, weekdays, covers US market hours
  workflow_dispatch:               # lets you press "Run workflow" manually
permissions:
  contents: write
concurrency: trade
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python trader.py
      - run: |
          git config user.name "paper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "update account" && git push)
